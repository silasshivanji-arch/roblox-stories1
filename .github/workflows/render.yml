name: Render Roblox Story

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare browser
        run: npx remotion browser ensure

      - name: Render video
        run: npm run render

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: roblox-story-video
          path: out/roblox-story.mp4
